name: Desktop flasher
on:
  push:
    branches: [desktop-flasher]
    paths:
      - "tools/desktop-flasher/**"
      - ".github/workflows/desktop-flasher.yml"
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: tools/desktop-flasher
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, arch: x86}
          - {os: macos-15, arch: arm64}
          - {os: ubuntu-22.04, arch: x86_64}
          - {os: ubuntu-22.04-arm, arch: aarch64}
          - {os: ubuntu-24.04-arm, arch: armv7l}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.arch != 'armv7l'
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch == 'x86' && 'x86' || (matrix.arch == 'x86_64' && 'x64' || 'arm64') }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./windows/build.ps1
          mkdir out
          Move-Item MeshCore-Windows-x86-x64.exe out/
      - if: runner.os == 'Linux' && matrix.arch != 'armv7l'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth python3-tk libtk8.6
      - if: runner.os != 'Windows' && matrix.arch != 'armv7l'
        run: bash build.sh ${{ matrix.arch }}
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'armv7l'
        with:
          platforms: arm
      - if: matrix.arch == 'armv7l'
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD:/src" -w /src arm32v7/debian:bookworm bash -ec '
            apt-get update -qq
            apt-get install -y python3-venv python3-dev python3-tk python3-cryptography python3-pil python3-cffi python3-yaml build-essential binutils zlib1g-dev xvfb xauth libffi-dev libssl-dev
            python3 -m venv --system-site-packages /tmp/venv
            . /tmp/venv/bin/activate
            sed "s/cryptography==43.0.3/cryptography>=38/" requirements.txt > /tmp/arm-req.txt
            sed "s/-r requirements.txt/-r \/tmp\/arm-req.txt/" build.sh | bash -s armv7l'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.arch }}
          path: tools/desktop-flasher/out/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: packages
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          tag="desktop-v1.${{ github.run_number }}"
          gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title "Прошивальщик MeshCore • $tag" --notes "Графический прошивальщик для Windows, macOS Apple Silicon, Linux x86-64, ARM64 и ARMv7. Скачайте файл своей платформы. Исходники и инструкция — в tools/desktop-flasher."
