# Every push and pull request runs the tests and builds every board's image (kept as the run's
# artifacts), and reports the deltas a release of them would have (tools/delta-report). Started by hand with a version, the run is a release: the images are packed into
# signed .mcfw files (tools/ota-sign) and published as a GitHub release. Devices that pin the root
# key's fingerprint (`set fw.root` on a repeater, the `fw_root` custom variable on a companion)
# install only images this workflow signed; whoever delivers them, nw.ommesh.ru included, can't
# make them take anything else.
#
# The root key is the secret MCFW_ROOT_KEY (the 32-byte seed in hex, from `ota-sign keygen`).
# Its fingerprint is published with every release (root.txt).
#
# The actions are pinned by commit: the toolchain action's code runs where the signed images are
# built. Releases are made from master only.
#
# A release carries only the boards and roles whose code changed, so the others don't update for
# nothing. Each image is built once more with no release number or version and a fixed date
# (MCFW_COUNTER=0, MCFW_VERSION=, SOURCE_DATE_EPOCH=0); the hash of that build (<board>-<role>.content) changes only with the
# code. A release lists these hashes for every board and role (content.txt) and leaves out those
# that match the release it follows: for a stable release the last stable one, for a dev release
# the last of either channel (devices that follow dev take both).

name: build and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown to people, e.g. 0.5.0"
        required: true
      channel:
        description: "Release channel: dev (nodes that follow dev take it by themselves) or stable (every node)"
        type: choice
        options: [dev, stable]
        default: dev
      counter:
        description: "Release number; devices never install a lower one than they run (default: this workflow's run number)"
        required: false

env:
  # The root key's fingerprint (root.txt of every release). The images pin it from the start
  # (MCFW_ROOT at build time), and the release step refuses a signing key that isn't this root.
  MCFW_RELEASE_ROOT: 7da3cdc4aca52140a5e650646d58df737625536027bd16e78fa50f1b88a012ea
  MCFW_COUNTER: ${{ inputs.counter || github.run_number }}
  MCFW_VERSION: ${{ inputs.version }}
  MCFW_CHANNEL: ${{ inputs.channel || 'dev' }}
  # One espflash for every run: another version may lay the same program out differently. Its
  # release's binary, taken only with this hash (built from source it was three minutes of the
  # Heltec job's eight).
  ESPFLASH_ZIP: https://github.com/esp-rs/espflash/releases/download/v4.6.0/espflash-x86_64-unknown-linux-musl.zip
  ESPFLASH_SHA256: d515ee13ae44ba913c31a2ca58dc5fd72d3362994ee1d7487a16b289dfbb6e4a
  # The Xtensa Rust the Heltec images are built with. A newer one changes every image, and with it
  # what a release carries: taken when this line says so, not when Espressif publishes it.
  XTENSA_RUST: 1.97.0.0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (protocol core and tools)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo test --workspace --locked
      # the Pro Micro's update installer: its swap, with the power going at any step
      - run: cargo test --lib --locked --target x86_64-unknown-linux-gnu
        working-directory: firmware/models/promicro/installer

  esp32s3:
    name: Heltec V4, V3 and Wireless Paper (ESP32-S3), ${{ matrix.build }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The images, and the build with no release number that says whether their code changed
        # (see the top). Each links all six, a minute on a runner's cores: side by side, not one
        # after the other.
        build: [images, content]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "MCFW_ROOT=$MCFW_RELEASE_ROOT" >> "$GITHUB_ENV"
      # A push or a pull request takes the toolchain and the built dependencies from an earlier run
      # (a minute to install, a minute and a half to build, of the job's four). A release takes
      # neither: what is signed is built from nothing, with nothing an earlier run left behind.
      - id: toolchain
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/.espup
            ~/exports
          key: xtensa-rust-${{ env.XTENSA_RUST }}-esp32s3
      # espup asks the GitHub API for the Xtensa Rust: with the token, not the runners' shared
      # anonymous limit, which runs out ("rate limit exceeded")
      - if: steps.toolchain.outputs.cache-hit != 'true'
        uses: esp-rs/xtensa-toolchain@67649b28a0139171102259d9982f93106aa2b54a # v1.6.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          default: true
          buildtargets: esp32s3
          version: ${{ env.XTENSA_RUST }}
          ldproxy: false
      # what the action does once it has installed the toolchain
      - if: steps.toolchain.outputs.cache-hit == 'true'
        run: |
          source "$HOME/exports"
          echo "$PATH" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=${LIBCLANG_PATH:-}" >> "$GITHUB_ENV"
          rustup default esp
      - if: github.event_name != 'workflow_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            firmware/models/heltec/target
          key: heltec-${{ env.XTENSA_RUST }}-${{ hashFiles('firmware/models/heltec/Cargo.lock', 'firmware/models/heltec/.cargo/config.toml', 'firmware/**/Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: espflash
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/espflash.zip" "$ESPFLASH_ZIP"
          echo "$ESPFLASH_SHA256  $RUNNER_TEMP/espflash.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/espflash.zip" espflash -d "$HOME/.cargo/bin"
          espflash --version
      - name: Heltec V4, V3 and Wireless Paper
        working-directory: firmware/models/heltec
        run: |
          out=../../..
          if [ "${{ matrix.build }}" = content ]; then
            export MCFW_COUNTER=0 MCFW_VERSION= SOURCE_DATE_EPOCH=0
            out=../../../content
            mkdir -p $out
          fi
          cargo build --locked --release
          # each board's images with its flash size and layout
          for role in repeater companion; do
            espflash save-image --chip esp32s3 --flash-size 16mb --partition-table v4/partitions.csv target/xtensa-esp32s3-none-elf/release/heltec-v4-$role $out/heltec-v4-$role.bin
            espflash save-image --chip esp32s3 --flash-size 8mb --partition-table v3/partitions.csv target/xtensa-esp32s3-none-elf/release/heltec-v3-$role $out/heltec-v3-$role.bin
            espflash save-image --chip esp32s3 --flash-size 8mb --partition-table paper/partitions.csv target/xtensa-esp32s3-none-elf/release/heltec-paper-$role $out/heltec-paper-$role.bin
          done
      - name: Content hashes
        if: matrix.build == 'content'
        run: for f in content/*.bin; do sha256sum "$f" | cut -c1-64 > "$(basename "$f" .bin).content"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.build }}-esp32s3
          path: |
            *.bin
            *.content

  esp32c6:
    name: XIAO ESP32-C6
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "MCFW_ROOT=$MCFW_RELEASE_ROOT" >> "$GITHUB_ENV"
      - run: rustup toolchain install
        working-directory: firmware/models/xiao-c6
      - name: espflash
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/espflash.zip" "$ESPFLASH_ZIP"
          echo "$ESPFLASH_SHA256  $RUNNER_TEMP/espflash.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/espflash.zip" espflash -d "$HOME/.cargo/bin"
          espflash --version
      - working-directory: firmware/models/xiao-c6
        run: |
          mkdir -p ../../../content
          save() { # <dir for the images> : the repeater's and the companion's
            for role in repeater companion; do
              espflash save-image --chip esp32c6 --flash-size 4mb target/riscv32imac-unknown-none-elf/release/$role "$1/xiao-c6-$role.bin"
            done
          }
          cargo build --locked --release
          save ../../..
          MCFW_COUNTER=0 MCFW_VERSION= SOURCE_DATE_EPOCH=0 cargo build --locked --release
          save ../../../content
      - name: Content hashes
        run: for f in content/*.bin; do sha256sum "$f" | cut -c1-64 > "$(basename "$f" .bin).content"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images-esp32c6
          path: |
            *.bin
            *.content

  nrf52840:
    name: LilyGO T-Echo and Pro Micro (nRF52840)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "MCFW_ROOT=$MCFW_RELEASE_ROOT" >> "$GITHUB_ENV"
      # nrf-sdc and nrf-mpsl generate their bindings with libclang. The runner's image has it, with
      # its clang; from apt only should a later image not: Ubuntu's mirror went unresolved for
      # hours once, and this job failed with it
      - name: libclang
        run: |
          lib=$(find /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu -maxdepth 1 -name 'libclang-[0-9]*.so.*' 2> /dev/null | sort -V | tail -1)
          if [ -n "$lib" ]; then
            echo "libclang: $lib"
            echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
          else
            sudo apt-get update && sudo apt-get install -y libclang-dev
          fi
      - run: rustup toolchain install
        working-directory: firmware/models/t-echo
      - working-directory: firmware/models/t-echo
        run: |
          mkdir -p ../../../content
          cargo build --locked --release
          python3 ../../../tools/uf2/elf2uf2.py target/thumbv7em-none-eabihf/release/companion ../../../t-echo-companion.uf2 --bin ../../../t-echo-companion.bin
          MCFW_COUNTER=0 MCFW_VERSION= SOURCE_DATE_EPOCH=0 cargo build --locked --release
          python3 ../../../tools/uf2/elf2uf2.py target/thumbv7em-none-eabihf/release/companion ../../../content/t-echo-companion.uf2 --bin ../../../content/t-echo-companion.bin
      - working-directory: firmware/models/promicro
        run: |
          cargo build --locked --release
          for role in repeater companion; do
            python3 ../../../tools/uf2/elf2uf2.py target/thumbv7em-none-eabihf/release/$role ../../../promicro-$role.uf2 --bin ../../../promicro-$role.bin
          done
          # the companion for web flashers too (serial DFU); not the repeater: the bootloader stages
          # an image that size over the repeater's data, and keeps a CRC that turns its updates off
          python3 ../../../tools/uf2/elf2uf2.py target/thumbv7em-none-eabihf/release/companion ../../../promicro-companion.uf2 --dfu-zip ../../../promicro-companion.zip
          MCFW_COUNTER=0 MCFW_VERSION= SOURCE_DATE_EPOCH=0 cargo build --locked --release
          for role in repeater companion; do
            python3 ../../../tools/uf2/elf2uf2.py target/thumbv7em-none-eabihf/release/$role ../../../content/promicro-$role.uf2 --bin ../../../content/promicro-$role.bin
          done
      - name: Content hashes
        run: for f in content/*.bin; do sha256sum "$f" | cut -c1-64 > "$(basename "$f" .bin).content"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images-nrf52840
          path: |
            *.bin
            *.uf2
            *.zip
            *.content

  # The deltas a release of this build would have, from the newest release and the newest stable
  # one, in the run's summary; a warning for each over the budget or the LoRa limit. A delta grows
  # with every change until the next release: one over the budget is worth a release before more
  # goes in. A release lists its own deltas (below).
  deltas:
    name: Deltas from the last release
    if: github.event_name != 'workflow_dispatch'
    needs: [esp32s3, esp32c6, nrf52840]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: images
          merge-multiple: true
      - run: cargo build --locked --release -p ota-sign
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/delta-report/delta_report.py images/*.bin

  release:
    name: Sign and publish
    if: github.event_name == 'workflow_dispatch'
    needs: [test, esp32s3, esp32c6, nrf52840]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: images
          merge-multiple: true
      - run: cargo build --locked --release -p ota-sign
      - name: Pack and sign
        env:
          MCFW_ROOT_KEY: ${{ secrets.MCFW_ROOT_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$MCFW_ROOT_KEY" || { echo "the MCFW_ROOT_KEY secret is not set"; exit 1; }
          test "$GITHUB_REF" = refs/heads/master || { echo "releases are made from master only, not $GITHUB_REF"; exit 1; }
          [[ "$MCFW_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]] || { echo "version '$MCFW_VERSION': letters, digits, '.', '+' and '-' only"; exit 1; }
          # devices never install a lower counter than they run: one far ahead (a typo such as
          # 4294967295) would leave them refusing every later release, until a USB update
          [[ "$MCFW_COUNTER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "counter '$MCFW_COUNTER' is not a release number"; exit 1; }
          last=$(gh release list --limit 100 --exclude-drafts --json tagName -q '.[].tagName' | sed -n 's/.*-r\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          last=${last:-0}
          test "$MCFW_COUNTER" -gt "$last" || { echo "counter $MCFW_COUNTER: release #$last is out, devices that run it would refuse this one"; exit 1; }
          limit=$(( (last > GITHUB_RUN_NUMBER ? last : GITHUB_RUN_NUMBER) + 1000 ))
          test "$MCFW_COUNTER" -le "$limit" || { echo "counter $MCFW_COUNTER is far ahead of release #$last and run #$GITHUB_RUN_NUMBER (a typo?)"; exit 1; }
          sign=target/release/ota-sign
          root=$($sign fingerprint --key-env MCFW_ROOT_KEY | awk '/fingerprint/{print $2}')
          test "$root" = "$MCFW_RELEASE_ROOT" || { echo "MCFW_ROOT_KEY is not the root the images pin ($MCFW_RELEASE_ROOT)"; exit 1; }
          mkdir -p out
          # the release this one follows, and the code its boards and roles run
          if [ "$MCFW_CHANNEL" = stable ]; then
            prev=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName')
          else
            prev=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[].tagName')
          fi
          echo "$prev" > prev-tag.txt
          touch prev-content.txt unchanged.txt
          if [ -n "$prev" ]; then
            gh release download "$prev" -p content.txt -O prev-content.txt --clobber || echo "$prev has no content.txt: every board and role goes out"
          fi
          for image in images/*.bin; do
            name=$(basename "$image" .bin)           # <board>-<role>, e.g. heltec-v4-repeater
            board=${name%-*}
            role=${name##*-}
            hash=$(cat "images/$name.content")
            echo "$hash  $name" >> out/content.txt
            if grep -qxF "$hash  $name" prev-content.txt; then
              echo "$name: the same code as in $prev, left out"
              echo "$name" >> unchanged.txt
              continue
            fi
            mcfw=out/$name-$MCFW_VERSION-r$MCFW_COUNTER.mcfw
            $sign bundle "$image" --board "$board" --role "$role" --counter "$MCFW_COUNTER" --version "$MCFW_VERSION" --channel "$MCFW_CHANNEL" -o "$mcfw"
            $sign sign "$mcfw" --key-env MCFW_ROOT_KEY
            if [ -f "images/$name.uf2" ]; then cp "images/$name.uf2" out/; fi
            if [ -f "images/$name.zip" ]; then cp "images/$name.zip" out/; fi
          done
          if ! ls out/*.mcfw > /dev/null 2>&1; then
            echo "no board's code changed since $prev: nothing to release"
            exit 1
          fi
          $sign fingerprint --key-env MCFW_ROOT_KEY > out/root.txt
          root=$(awk '/fingerprint/{print $2}' out/root.txt)
          for mcfw in out/*.mcfw; do $sign verify "$mcfw" --root "$root"; done
      # A delta from each of the last three releases of the board and role, for the devices that
      # run one of them and fetch updates over LoRa from a neighbouring repeater
      # (meshcore::fwshare); each is checked to rebuild the signed image from its base. Releases
      # that left the board and role out don't count: its devices still run an older one. A stable
      # release also takes the last two stable ones: after a run of dev releases those are what the
      # devices that follow stable still run.
      - name: Deltas from the last releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sign=target/release/ota-sign
          root=$(awk '/fingerprint/{print $2}' out/root.txt)
          # GitHub answers a download with HTTP 500 now and then; one of the thirty or so here
          # failed whole releases (0.8.7-dev.16, twice): asked again, after a pause
          fetch() {
            for try in 1 2 3 4; do
              gh release download "$@" && return 0
              echo "::warning::download of $* failed (try $try)"
              sleep $((try * 10))
            done
            gh release download "$@"
          }
          # What a node takes over LoRa by itself: at most meshcore::fwshare::MAX_LORA_FILE, and on a Pro Micro
          # running release #62 or before what its staging area (0x7B000..0xD9000,
          # firmware/models/promicro/src/ota.rs) holds next to the image the delta rebuilds (later
          # ones apply a delta as it comes)
          lora_max=163840
          lora_room() {
            case "$1" in
              promicro-*) if [ "${2##*-r}" -le 62 ]; then local img; img=$(stat -c %s "images/$1.bin"); echo $(( 385024 - (img + 4095) / 4096 * 4096 )); else echo "$lora_max"; fi ;;
              *) echo "$lora_max" ;;
            esac
          }
          tags=$(gh release list --limit 30 --exclude-drafts --json tagName -q '.[].tagName')
          stable_tags=" $(gh release list --limit 30 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName' | tr '\n' ' ') "
          # what each of them carries, asked eight at a time, not one after another
          mkdir -p listed
          printf '%s\n' $tags | xargs -r -P 8 -I{} bash -euo pipefail -c 'gh release view "$1" --json assets -q ".assets[].name" > "listed/$1"' list {}
          declare -A assets
          for tag in $tags; do
            assets[$tag]=$(cat "listed/$tag")
          done
          # the deltas to make, in the table's order: <row> <board>-<role> <release> <its file>
          : > deltas.txt
          for mcfw in out/*.mcfw; do
            name=$(basename "$mcfw" "-$MCFW_VERSION-r$MCFW_COUNTER.mcfw")   # <board>-<role>
            # the releases to make deltas from: newest first, as said above
            bases="" n=0 s=0
            for tag in $tags; do
              base=$(printf '%s\n' "${assets[$tag]}" | grep -E "^$name-.*\.mcfw$" | head -1 || true)
              [ -n "$base" ] || continue
              is_stable=0
              [[ "$stable_tags" == *" $tag "* ]] && is_stable=1
              if [ "$n" -lt 3 ] || { [ "$MCFW_CHANNEL" = stable ] && [ "$is_stable" = 1 ] && [ "$s" -lt 2 ]; }; then
                bases="$bases $tag"
              fi
              n=$((n + 1))
              s=$((s + is_stable))
              if [ "$n" -ge 3 ] && { [ "$MCFW_CHANNEL" != stable ] || [ "$s" -ge 2 ]; }; then
                break
              fi
            done
            for tag in $bases; do
              base=$(printf '%s\n' "${assets[$tag]}" | grep -E "^$name-.*\.mcfw$" | head -1 || true)
              printf '%03d %s %s %s\n' "$(wc -l < deltas.txt)" "$name" "$tag" "$base" >> deltas.txt
            done
          done
          # One of them, and its row of the table in rows/<row>
          delta() {
            local row=$1 name=$2 tag=$3 base=$4
            local mcfw=out/$name-$MCFW_VERSION-r$MCFW_COUNTER.mcfw
            local mcfd=out/$name-$MCFW_VERSION-r$MCFW_COUNTER.from-${tag##*-}.mcfd
            mkdir -p "prev/$tag"
            fetch "$tag" -p "$base" -D "prev/$tag" --clobber
            $sign delta "prev/$tag/$base" "$mcfw" -o "$mcfd"
            $sign verify "$mcfd" --root "$root" --base "prev/$tag/$base"
            local size room mark=""
            size=$(stat -c %s "$mcfd")
            room=$(lora_room "$name" "$tag")
            [ "$room" -le "$lora_max" ] || room=$lora_max
            if [ "$size" -gt "$room" ]; then
              mark=" (over the LoRa limit, $((room / 1024)) KB)"
              echo "::warning title=Delta over the LoRa limit::$name from $tag is $((size / 1024)) KB, more than $((room / 1024)) KB: nodes on $tag don't take it from a neighbour over LoRa by themselves, only over Wi-Fi, USB or BLE, or by hand (fw update) where $tag has that"
            fi
            echo "| $name | $tag | $((size / 1024)) KB$mark |" > "rows/$row"
          }
          # ota-sign makes a delta on one core, in seconds, and there are thirty or so: as many at
          # once as there are cores. One that fails fails the step.
          export -f delta fetch lora_room
          export sign root lora_max
          mkdir -p rows
          xargs -r -P "$(nproc)" -L 1 bash -euo pipefail -c 'delta "$@"' delta < deltas.txt
          { printf '| delta | from | size |\n|---|---|---|\n'; find rows -type f | sort | xargs -r cat; } > deltas.md
          cat deltas.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=$(awk '/fingerprint/{print $2}' out/root.txt)
          prerelease=$([ "$MCFW_CHANNEL" = dev ] && echo --prerelease || true)
          {
            echo "Signed by the root key with fingerprint \`$root\`. Pin it on a device with \`set fw.root $root\` (repeater) or the \`fw_root\` custom variable (companion), then update with the board's .mcfw file. A .uf2 is the T-Echo or Pro Micro image for the USB bootloader's drive; a .zip, the Pro Micro companion's for its serial DFU (web flashers' custom firmware). The .mcfd files are deltas from earlier releases, which repeaters with \`fw.serve on\` hand on to the companions next to them."
            if [ -s unchanged.txt ]; then
              echo
              echo "Left out, the same code as in $(cat prev-tag.txt): $(paste -sd, unchanged.txt | sed 's/,/, /g'). Those devices keep what they run; content.txt lists the code of every board and role."
            fi
          } > notes.md
          gh release create "v$MCFW_VERSION-r$MCFW_COUNTER" out/* $prerelease \
            --title "$MCFW_VERSION (release #$MCFW_COUNTER, $MCFW_CHANNEL)" \
            --notes-file notes.md
