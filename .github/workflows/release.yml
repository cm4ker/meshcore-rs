# Every push and pull request runs the tests and builds every board's image (kept as the run's
# artifacts). Started by hand with a version, the run is a release: the images are packed into
# signed .mcfw files (tools/ota-sign) and published as a GitHub release. Devices that pin the root
# key's fingerprint (`set ota.root` on a repeater, the `ota_root` custom variable on a companion)
# install only images this workflow signed; whoever delivers them, nw.ommesh.ru included, can't
# make them take anything else.
#
# The root key is the secret MCFW_ROOT_KEY (the 32-byte seed in hex, from `ota-sign keygen`).
# Its fingerprint is published with every release (root.txt).
#
# The actions are pinned by commit: the toolchain action's code runs where the signed images are
# built. Releases are made from master only.
#
# A release carries only the boards and roles whose code changed, so the others don't update for
# nothing. Each image is built once more with no release number and a fixed date (MCFW_COUNTER=0,
# SOURCE_DATE_EPOCH=0); the hash of that build (<board>-<role>.content) changes only with the
# code. A release lists these hashes for every board and role (content.txt) and leaves out those
# that match the release it follows: for a stable release the last stable one, for a dev release
# the last of either channel (devices that follow dev take both).

name: build and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown to people, e.g. 0.5.0"
        required: true
      channel:
        description: "Release channel: dev (nodes that follow dev take it by themselves) or stable (every node)"
        type: choice
        options: [dev, stable]
        default: dev
      counter:
        description: "Release number; devices never install a lower one than they run (default: this workflow's run number)"
        required: false

env:
  # The root key's fingerprint (root.txt of every release). The images pin it from the start
  # (MCFW_ROOT at build time), and the release step refuses a signing key that isn't this root.
  MCFW_RELEASE_ROOT: 7da3cdc4aca52140a5e650646d58df737625536027bd16e78fa50f1b88a012ea
  MCFW_COUNTER: ${{ inputs.counter || github.run_number }}
  MCFW_VERSION: ${{ inputs.version }}
  MCFW_CHANNEL: ${{ inputs.channel || 'dev' }}
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (protocol core and tools)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo test --workspace --locked

  esp32s3:
    name: Heltec V4 and V3 (ESP32-S3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "MCFW_ROOT=$MCFW_RELEASE_ROOT" >> "$GITHUB_ENV"
      - uses: esp-rs/xtensa-toolchain@67649b28a0139171102259d9982f93106aa2b54a # v1.6.0
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
      # one espflash for every run: another version may lay the same program out differently
      - run: cargo install espflash --version 4.6.0 --locked
      - name: Heltec V4
        working-directory: firmware/models/heltec-v4
        run: |
          mkdir -p ../../../content
          cargo build --locked --release
          espflash save-image --chip esp32s3 --flash-size 16mb target/xtensa-esp32s3-none-elf/release/heltec-v4 ../../../heltec-v4-repeater.bin
          espflash save-image --chip esp32s3 --flash-size 16mb target/xtensa-esp32s3-none-elf/release/companion ../../../heltec-v4-companion.bin
          MCFW_COUNTER=0 SOURCE_DATE_EPOCH=0 cargo build --locked --release
          espflash save-image --chip esp32s3 --flash-size 16mb target/xtensa-esp32s3-none-elf/release/heltec-v4 ../../../content/heltec-v4-repeater.bin
          espflash save-image --chip esp32s3 --flash-size 16mb target/xtensa-esp32s3-none-elf/release/companion ../../../content/heltec-v4-companion.bin
      - name: Heltec V3
        working-directory: firmware/models/heltec-v4
        run: |
          cargo build --locked --release --features heltec-v3
          espflash save-image --chip esp32s3 --flash-size 8mb --partition-table partitions-v3.csv target/xtensa-esp32s3-none-elf/release/heltec-v4 ../../../heltec-v3-repeater.bin
          espflash save-image --chip esp32s3 --flash-size 8mb --partition-table partitions-v3.csv target/xtensa-esp32s3-none-elf/release/companion ../../../heltec-v3-companion.bin
          MCFW_COUNTER=0 SOURCE_DATE_EPOCH=0 cargo build --locked --release --features heltec-v3
          espflash save-image --chip esp32s3 --flash-size 8mb --partition-table partitions-v3.csv target/xtensa-esp32s3-none-elf/release/heltec-v4 ../../../content/heltec-v3-repeater.bin
          espflash save-image --chip esp32s3 --flash-size 8mb --partition-table partitions-v3.csv target/xtensa-esp32s3-none-elf/release/companion ../../../content/heltec-v3-companion.bin
      - name: Content hashes
        run: for f in content/*.bin; do sha256sum "$f" | cut -c1-64 > "$(basename "$f" .bin).content"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images-esp32s3
          path: |
            *.bin
            *.content

  esp32c6:
    name: XIAO ESP32-C6
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "MCFW_ROOT=$MCFW_RELEASE_ROOT" >> "$GITHUB_ENV"
      - run: rustup toolchain install
        working-directory: firmware/models/xiao-c6
      - run: cargo install espflash --version 4.6.0 --locked
      - working-directory: firmware/models/xiao-c6
        run: |
          mkdir -p ../../../content
          cargo build --locked --release
          espflash save-image --chip esp32c6 --flash-size 4mb target/riscv32imac-unknown-none-elf/release/companion ../../../xiao-c6-companion.bin
          MCFW_COUNTER=0 SOURCE_DATE_EPOCH=0 cargo build --locked --release
          espflash save-image --chip esp32c6 --flash-size 4mb target/riscv32imac-unknown-none-elf/release/companion ../../../content/xiao-c6-companion.bin
      - name: Content hashes
        run: for f in content/*.bin; do sha256sum "$f" | cut -c1-64 > "$(basename "$f" .bin).content"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images-esp32c6
          path: |
            *.bin
            *.content

  nrf52840:
    name: LilyGO T-Echo (nRF52840)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "MCFW_ROOT=$MCFW_RELEASE_ROOT" >> "$GITHUB_ENV"
      # nrf-sdc and nrf-mpsl generate their bindings with libclang
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: rustup toolchain install
        working-directory: firmware/models/t-echo
      - working-directory: firmware/models/t-echo
        run: |
          mkdir -p ../../../content
          cargo build --locked --release
          python3 ../../../tools/uf2/elf2uf2.py target/thumbv7em-none-eabihf/release/companion ../../../t-echo-companion.uf2 --bin ../../../t-echo-companion.bin
          MCFW_COUNTER=0 SOURCE_DATE_EPOCH=0 cargo build --locked --release
          python3 ../../../tools/uf2/elf2uf2.py target/thumbv7em-none-eabihf/release/companion ../../../content/t-echo-companion.uf2 --bin ../../../content/t-echo-companion.bin
      - name: Content hashes
        run: for f in content/*.bin; do sha256sum "$f" | cut -c1-64 > "$(basename "$f" .bin).content"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images-nrf52840
          path: |
            *.bin
            *.uf2
            *.content

  release:
    name: Sign and publish
    if: github.event_name == 'workflow_dispatch'
    needs: [test, esp32s3, esp32c6, nrf52840]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: images
          merge-multiple: true
      - run: cargo build --locked --release -p ota-sign
      - name: Pack and sign
        env:
          MCFW_ROOT_KEY: ${{ secrets.MCFW_ROOT_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$MCFW_ROOT_KEY" || { echo "the MCFW_ROOT_KEY secret is not set"; exit 1; }
          test "$GITHUB_REF" = refs/heads/master || { echo "releases are made from master only, not $GITHUB_REF"; exit 1; }
          [[ "$MCFW_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]] || { echo "version '$MCFW_VERSION': letters, digits, '.', '+' and '-' only"; exit 1; }
          # devices never install a lower counter than they run: one far ahead (a typo such as
          # 4294967295) would leave them refusing every later release, until a USB update
          [[ "$MCFW_COUNTER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "counter '$MCFW_COUNTER' is not a release number"; exit 1; }
          last=$(gh release list --limit 100 --exclude-drafts --json tagName -q '.[].tagName' | sed -n 's/.*-r\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          last=${last:-0}
          test "$MCFW_COUNTER" -gt "$last" || { echo "counter $MCFW_COUNTER: release #$last is out, devices that run it would refuse this one"; exit 1; }
          limit=$(( (last > GITHUB_RUN_NUMBER ? last : GITHUB_RUN_NUMBER) + 1000 ))
          test "$MCFW_COUNTER" -le "$limit" || { echo "counter $MCFW_COUNTER is far ahead of release #$last and run #$GITHUB_RUN_NUMBER (a typo?)"; exit 1; }
          sign=target/release/ota-sign
          root=$($sign fingerprint --key-env MCFW_ROOT_KEY | awk '/fingerprint/{print $2}')
          test "$root" = "$MCFW_RELEASE_ROOT" || { echo "MCFW_ROOT_KEY is not the root the images pin ($MCFW_RELEASE_ROOT)"; exit 1; }
          mkdir -p out
          # the release this one follows, and the code its boards and roles run
          if [ "$MCFW_CHANNEL" = stable ]; then
            prev=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName')
          else
            prev=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[].tagName')
          fi
          echo "$prev" > prev-tag.txt
          touch prev-content.txt unchanged.txt
          if [ -n "$prev" ]; then
            gh release download "$prev" -p content.txt -O prev-content.txt --clobber || echo "$prev has no content.txt: every board and role goes out"
          fi
          for image in images/*.bin; do
            name=$(basename "$image" .bin)           # <board>-<role>, e.g. heltec-v4-repeater
            board=${name%-*}
            role=${name##*-}
            hash=$(cat "images/$name.content")
            echo "$hash  $name" >> out/content.txt
            if grep -qxF "$hash  $name" prev-content.txt; then
              echo "$name: the same code as in $prev, left out"
              echo "$name" >> unchanged.txt
              continue
            fi
            mcfw=out/$name-$MCFW_VERSION-r$MCFW_COUNTER.mcfw
            $sign bundle "$image" --board "$board" --role "$role" --counter "$MCFW_COUNTER" --version "$MCFW_VERSION" --channel "$MCFW_CHANNEL" -o "$mcfw"
            $sign sign "$mcfw" --key-env MCFW_ROOT_KEY
            if [ -f "images/$name.uf2" ]; then cp "images/$name.uf2" out/; fi
          done
          if ! ls out/*.mcfw > /dev/null 2>&1; then
            echo "no board's code changed since $prev: nothing to release"
            exit 1
          fi
          $sign fingerprint --key-env MCFW_ROOT_KEY > out/root.txt
          root=$(awk '/fingerprint/{print $2}' out/root.txt)
          for mcfw in out/*.mcfw; do $sign verify "$mcfw" --root "$root"; done
      # A delta from each of the last three releases of the board and role, for the devices that
      # run one of them and fetch updates over LoRa from a neighbouring repeater
      # (meshcore::fwshare); each is checked to rebuild the signed image from its base. Releases
      # that left the board and role out don't count: its devices still run an older one.
      - name: Deltas from the last releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sign=target/release/ota-sign
          root=$(awk '/fingerprint/{print $2}' out/root.txt)
          tags=$(gh release list --limit 30 --exclude-drafts --json tagName -q '.[].tagName')
          declare -A assets
          for tag in $tags; do
            assets[$tag]=$(gh release view "$tag" --json assets -q '.assets[].name')
          done
          for mcfw in out/*.mcfw; do
            name=$(basename "$mcfw" "-$MCFW_VERSION-r$MCFW_COUNTER.mcfw")   # <board>-<role>
            n=0
            for tag in $tags; do
              base=$(printf '%s\n' "${assets[$tag]}" | grep -E "^$name-.*\.mcfw$" | head -1 || true)
              [ -n "$base" ] || continue
              mkdir -p "prev/$tag"
              gh release download "$tag" -p "$base" -D "prev/$tag" --clobber
              delta=out/$name-$MCFW_VERSION-r$MCFW_COUNTER.from-${tag##*-}.mcfd
              $sign delta "prev/$tag/$base" "$mcfw" -o "$delta"
              $sign verify "$delta" --root "$root" --base "prev/$tag/$base"
              n=$((n + 1))
              [ "$n" -lt 3 ] || break
            done
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=$(awk '/fingerprint/{print $2}' out/root.txt)
          prerelease=$([ "$MCFW_CHANNEL" = dev ] && echo --prerelease || true)
          {
            echo "Signed by the root key with fingerprint \`$root\`. Pin it on a device with \`set ota.root $root\` (repeater) or the \`ota_root\` custom variable (companion), then update with the board's .mcfw file. A .uf2 is the T-Echo image for the USB bootloader. The .mcfd files are deltas from earlier releases, which repeaters with \`fw.serve on\` hand on to the companions next to them."
            if [ -s unchanged.txt ]; then
              echo
              echo "Left out, the same code as in $(cat prev-tag.txt): $(paste -sd, unchanged.txt | sed 's/,/, /g'). Those devices keep what they run; content.txt lists the code of every board and role."
            fi
          } > notes.md
          gh release create "v$MCFW_VERSION-r$MCFW_COUNTER" out/* $prerelease \
            --title "$MCFW_VERSION (release #$MCFW_COUNTER, $MCFW_CHANNEL)" \
            --notes-file notes.md
