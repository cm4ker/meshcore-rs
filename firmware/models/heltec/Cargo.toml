cargo-features = ["panic-immediate-abort"]

# Heltec WiFi LoRa 32 boards: what the V3 and V4 share in `shared`, what sets each apart in `v3`
# and `v4`, each with its own firmware images (repeater, companion). `paper`, the Wireless Paper
# (a V3 with an e-paper and its own pins), takes the board-independent parts of `shared`.
[workspace]
members  = ["shared", "v3", "v4", "paper"]
resolver = "3"

[workspace.package]
edition      = "2024"
rust-version = "1.95"
version      = "0.1.0"

[workspace.dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
# release_max_level_off compiles out every log call site (and its format strings) across the
# whole dep tree in release, and lets esp-println's ~64 KB line buffer get DCE'd too. Measured
# -63.5 KB flash, -64 KB RAM. The interactive serial CLI (get/set) writes the console directly,
# not through log, so on-demand status survives; only async info/warn/error go quiet. Dev keeps
# every level (profile.dev, backtraces on).
log                    = { version = "0.4.27", features = ["release_max_level_off"] }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
meshcore = { path = "../../../crates/meshcore" }
meshcore-fw = { version = "0.1.0", path = "../../common", features = ["esp32s3"] }
meshcore-fw-core = { version = "0.1.0", path = "../../fw-core" }
meshcore-ui = { version = "0.1.0", path = "../../ui" }
heltec-shared = { path = "shared" }
esp-storage = { version = "0.10.0", features = ["esp32s3"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
embedded-hal = "1.0"
libm = "0.2.16"
# coex: the repeater runs BLE (`start ota ble`) next to its Wi-Fi station; esp-now: its bridge
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s3", "wifi", "ble", "coex", "esp-now", "log-04", "unstable"] }
embassy-net = { version = "0.9", features = ["tcp", "udp", "dns", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
edge-dhcp = "0.8"
edge-nal = "0.7"
# no default features: its `all` turns on IPv6, ICMP, multicast and medium-ip in smoltcp
edge-nal-embassy = { version = "0.9", default-features = false, features = ["proto-ipv4", "medium-ethernet", "udp"] }
ssd1306 = "0.10"
embedded-graphics = "0.8"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 'z'
# strips panic fmt/unwind glue across the generic code (~136 KB flash, ~64 KB RAM); panics become a
# bare abort/reset with no esp-backtrace dump. [profile.dev] keeps the default so dev builds still
# print backtraces. Needs the nightly `cargo-features` opt-in above.
panic         = 'immediate-abort'

[patch.crates-io]
# fixed BLE passkey support, see ../../vendor/README.md
trouble-host = { path = "../../vendor/trouble-host" }
