# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  # the SHA-2 rounds in a loop, not unrolled (SHA-512 alone is 49 KB unrolled), at a cost nobody
  # notices in signatures and hashes here
  "--cfg", 'sha2_backend_soft="compact"',
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
# optimize_for_size: build core/alloc with the size-tuned impls (fmt, sort, …)
build-std-features = ["optimize_for_size"]
