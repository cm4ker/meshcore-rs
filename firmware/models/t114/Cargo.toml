[package]
edition      = "2024"
name         = "t114"
rust-version = "1.88"
version      = "0.1.0"

[lib]
test = false
bench = false

[[bin]]
name = "repeater"
path = "./src/bin/repeater.rs"
test = false
bench = false

[[bin]]
name = "companion"
path = "./src/bin/companion.rs"
test = false
bench = false

[dependencies]
# the nRF52840 side the Pro Micro's firmware has: BLE on the SoftDevice, the console, USB, the
# flash, the repeater and the companion around the board
promicro = { path = "../promicro" }
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
critical-section = { version = "1.2", features = ["restore-state-u8"] }
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "nfc-pins-as-gpio"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embedded-alloc = "0.6"
embedded-graphics = "0.8"
static_cell = "2.1.1"
log = "0.4.27"
heapless = "0.9"
# deltas applied in place (src/ota.rs)
meshcore = { path = "../../../crates/meshcore", features = ["inplace"] }
meshcore-fw-core = { version = "0.1.0", path = "../../fw-core" }
meshcore-ui = { version = "0.1.0", path = "../../ui" }
meshcore-inplace = { path = "../../../crates/inplace" }
embedded-storage = "0.3"
sha2 = { version = "0.11.1", default-features = false }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
# for size before speed, as on the Heltec boards: a tenth less than "s"
opt-level     = "z"

[patch.crates-io]
# the USB fixes, see ../../vendor/README.md
embassy-nrf = { path = "../../vendor/embassy-nrf-0.11" }
# the scalar arithmetic once in the image
curve25519-dalek = { path = "../../vendor/curve25519-dalek" }
