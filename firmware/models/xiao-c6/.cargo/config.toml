# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c6"
# rustflags: those of every board, in ../../../.cargo/config.toml. No frame pointers: a panic
# prints its message and place, not a backtrace, for 19 KB less code

[build]
target = "riscv32imac-unknown-none-elf"
