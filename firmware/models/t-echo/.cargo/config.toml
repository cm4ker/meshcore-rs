[build]
target = "thumbv7em-none-eabihf"

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["optimize_for_size"]

[target.thumbv7em-none-eabihf]
# merged with ../../../.cargo/config.toml (`sha2_backend_soft="compact"`).
# Panics trap to HardFault (recorded with pc/lr in `.uninit.crash` and resolved via debuginfo).
rustflags = [
    "-C", "link-arg=--nmagic",
    "-Z", "location-detail=none",
    "-Z", "fmt-debug=none",
    "-C", "panic=immediate-abort",
    "-Z", "unstable-options",
]

[env]
# nrf-sdc/nrf-mpsl generate bindings with clang for a bare-metal target: its own stdint.h, not a
# hosted one picked up from the build machine (LIBCLANG_PATH must name an LLVM for the host)
BINDGEN_EXTRA_CLANG_ARGS = "-ffreestanding"
