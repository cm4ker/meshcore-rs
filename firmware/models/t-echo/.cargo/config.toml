[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# sha2_backend_soft: the SHA-2 rounds in a loop, not unrolled (32 KB less code), at a cost nobody
# notices in signatures and hashes here
rustflags = ["-C", "link-arg=--nmagic", "--cfg", 'sha2_backend_soft="compact"']

[env]
# nrf-sdc/nrf-mpsl generate bindings with clang for a bare-metal target: its own stdint.h, not a
# hosted one picked up from the build machine (LIBCLANG_PATH must name an LLVM for the host)
BINDGEN_EXTRA_CLANG_ARGS = "-ffreestanding"
