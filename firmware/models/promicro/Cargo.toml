[package]
edition      = "2024"
name         = "promicro"
rust-version = "1.88"
version      = "0.1.0"

[features]
# AHTX0 / SHTC3 / SHT4X hand drivers. Off by default: the Pro Micro's UF2 region is at its
# ceiling with INA219 + BME280 + BMP280 + the descriptor engine, so these opt in on a board (or a
# trimmed build) that has the room. Linear sensors need no feature — add them with `sensor add`.
extra-sensors = []

[lib]
test = false
bench = false

[[bin]]
name = "repeater"
path = "./src/bin/repeater.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
# our own critical sections (src/sd.rs): they mask the application's interrupts only, never the
# SoftDevice's, and keep the BASEPRI they found
critical-section = { version = "1.2", features = ["restore-state-u8"] }
# set-vtor: our vector table takes over from the MBR/SoftDevice forwarding of the bootloader
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
# nfc-pins-as-gpio: the radio's RESET and DIO1 sit on P0.09/P0.10, the NFC antenna pins
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "nfc-pins-as-gpio"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embedded-alloc = "0.6"
static_cell = "2.1.1"
log = "0.4.27"
heapless = "0.9"
embedded-storage = "0.3"
meshcore = { version = "0.1.0", path = "../../../crates/meshcore" }
meshcore-fw-core = { version = "0.1.0", path = "../../fw-core" }
# the Diffie-Hellman of LE Secure Connections pairing (src/ble.rs)
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"

[patch.crates-io]
# the USB fixes, see ../../vendor/README.md
embassy-nrf = { path = "../../vendor/embassy-nrf-0.11" }
