[package]
edition      = "2024"
name         = "promicro-installer"
rust-version = "1.88"
version      = "0.1.0"
description  = "Swaps a staged firmware update with the Pro Micro's app flash (both in its internal flash); resumes after a power loss"

# the swap itself, tested on the host: cargo test --lib --target <host triple>
[lib]
bench = false

[[bin]]
name = "installer"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# its compact backend (.cargo/config.toml): the unrolled one alone is 7 KB
sha2 = { version = "0.11.1", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7.7"
# set-vtor: faults go to our own handlers, not through the app's (half-copied) vector table
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
nrf-pac = { version = "0.4.0", features = ["nrf52840"] }

# its own build, not part of the firmware's
[workspace]

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
# it has to fit in three pages
opt-level     = "z"
panic         = "abort"

[profile.dev]
opt-level = "s"
panic     = "abort"
