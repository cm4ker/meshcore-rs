[package]
name = "meshcore"
version = "0.1.0"
edition = "2024"
description = "Wire-compatible MeshCore protocol core (no_std): packets, crypto, routing, repeater logic"
license = "MIT"

[dependencies]
aes = { version = "0.9.3", default-features = false }
curve25519-dalek = { version = "5.0.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["hazmat"] }
hmac = { version = "0.13.0", default-features = false }
libm = "0.2.16"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
sha2 = { version = "0.11.1", default-features = false }

[dev-dependencies]
bsdiff = "0.2.1"
hex = "0.4.3"
miniz_oxide = { version = "0.9.1", features = ["with-alloc"] }
